<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LC-Guide® — 液相色谱例行分析软件</title>
<style>
  /* ========================================================================
     LC-Guide® — AB SCIEX Cliquid Guided Workflow × Open Claude UI (CDS)
     Editorial Warmth · 4-Layer Surfaces · Clay (#c6613f) + Accent (#184f95)
     Single-Stroke Hairlines · 7-Stop Scroll Fade · Light / Dark Dual Mode
     ======================================================================== */
  :root {
    --cds-surface-0: #f9f9f7;
    --cds-surface-1: #f4f3ef;
    --cds-surface-2: #ffffff;
    --cds-surface-3: #efeee9;
    --cds-surface-hover: rgba(20, 20, 19, 0.045);
    --cds-surface-active: rgba(20, 20, 19, 0.08);
    --cds-surface-popover: #ffffff;

    --cds-text-primary: #141413;
    --cds-text-secondary: #52514e;
    --cds-text-muted: #898781;

    --brand: #c6613f;
    --brand-hover: #b55433;
    --cds-clay: #d97757;
    --cds-clay-soft: rgba(217, 119, 87, 0.12);
    --cds-clay-border: rgba(217, 119, 87, 0.34);

    --cds-text-accent: #184f95;
    --cds-accent-soft: rgba(24, 79, 149, 0.09);
    --cds-border-accent: #86b6ef;
    --cds-focus-shadow: 0 0 0 1px var(--cds-surface-2), 0 0 0 2.5px rgba(24, 79, 149, 0.28);

    --cds-border-subtle: rgba(20, 20, 19, 0.08);
    --cds-border-strong: rgba(20, 20, 19, 0.15);

    --cds-success: #1f7a53;
    --cds-success-bg: rgba(31, 122, 83, 0.1);
    --cds-warning: #a86414;
    --cds-warning-bg: rgba(168, 100, 20, 0.11);
    --cds-danger: #bf3b42;
    --cds-danger-bg: rgba(191, 59, 66, 0.1);

    --cds-radius-xs: 4px;
    --cds-radius-sm: 6px;
    --cds-radius-md: 8px;
    --cds-radius-panel: 10px;
    --cds-radius-card: 12px;
    --cds-radius-dialog: 16px;
    --cds-radius-pill: 9999px;

    --cds-shadow-card: 0 1px 2px rgba(20, 20, 19, 0.04), 0 0 0 0.5px rgba(20, 20, 19, 0.05);
    --cds-shadow-popover: 0 0 0 0.5px rgba(20, 20, 19, 0.09), 0 12px 32px -4px rgba(20, 20, 19, 0.14);
    --cds-shadow-pill: 0 1px 2px rgba(20, 20, 19, 0.08);

    --cds-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --cds-ease-snap: cubic-bezier(0.22, 1, 0.36, 1);
    --cds-font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;
    --cds-font-serif: Georgia, 'Songti SC', 'Noto Serif SC', 'STSong', serif;
    --cds-font-mono: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
  }

  .dark {
    --cds-surface-0: #0e0e0d;
    --cds-surface-1: #161615;
    --cds-surface-2: #1c1c1a;
    --cds-surface-3: #242422;
    --cds-surface-hover: rgba(255, 255, 255, 0.055);
    --cds-surface-active: rgba(255, 255, 255, 0.095);
    --cds-surface-popover: #262624;

    --cds-text-primary: #f0efec;
    --cds-text-secondary: #b9b7ae;
    --cds-text-muted: #898781;

    --brand: #cc6b49;
    --brand-hover: #da7a58;
    --cds-clay: #cc6b49;
    --cds-clay-soft: rgba(204, 107, 73, 0.16);
    --cds-clay-border: rgba(204, 107, 73, 0.36);

    --cds-text-accent: #7ab0f2;
    --cds-accent-soft: rgba(122, 176, 242, 0.13);
    --cds-border-accent: #6da7ec;
    --cds-focus-shadow: 0 0 0 1px var(--cds-surface-2), 0 0 0 2.5px rgba(109, 167, 236, 0.34);

    --cds-border-subtle: rgba(255, 255, 255, 0.085);
    --cds-border-strong: rgba(255, 255, 255, 0.16);

    --cds-success: #45b984;
    --cds-success-bg: rgba(69, 185, 132, 0.14);
    --cds-warning: #e5a347;
    --cds-warning-bg: rgba(229, 163, 71, 0.15);
    --cds-danger: #e46b71;
    --cds-danger-bg: rgba(228, 107, 113, 0.15);

    --cds-shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25), 0 0 0 0.5px rgba(255, 255, 255, 0.06);
    --cds-shadow-popover: 0 0 0 0.5px rgba(255, 255, 255, 0.12), 0 16px 36px -4px rgba(0, 0, 0, 0.52);
    --cds-shadow-pill: 0 1px 3px rgba(0, 0, 0, 0.32);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--cds-surface-0);
    color: var(--cds-text-primary);
    font-family: var(--cds-font-sans);
    font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--cds-font-mono); font-variant-numeric: tabular-nums; }
  .tabular { font-variant-numeric: tabular-nums; }
  .editorial { font-family: var(--cds-font-serif); letter-spacing: -0.015em; }

  @keyframes cds-breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.88); }
  }
  @keyframes cds-pulse {
    0% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.48); }
    70% { box-shadow: 0 0 0 6px rgba(217, 119, 87, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0); }
  }
  .dot-breathe { animation: cds-breathe 2.4s var(--cds-ease-out) infinite; }
  .dot-pulse { animation: cds-pulse 1.2s var(--cds-ease-out) infinite; }

  /* Shell */
  .shell {
    display: grid;
    grid-template-columns: 288px minmax(0, 1fr);
    height: 100vh;
    overflow: hidden;
    background: var(--cds-surface-0);
  }

  /* Left Guided Navigator */
  .nav-rail {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--cds-surface-1);
    border-right: 1px solid var(--cds-border-subtle);
    overflow: hidden;
    user-select: none;
  }
  .nav-header {
    padding: 15px 17px 13px;
    border-bottom: 1px solid var(--cds-border-subtle);
  }
  .nav-brand-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 13px;
  }
  .brand-btn {
    display: inline-flex; align-items: center; gap: 9px; border: none; background: transparent;
    color: var(--cds-text-primary); cursor: pointer; padding: 0; text-align: left;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: var(--cds-radius-md);
    background: var(--cds-clay-soft); color: var(--brand);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-name { font-size: 13.5px; font-weight: 700; display: block; line-height: 1.15; }
  .brand-sub { font-size: 11px; color: var(--cds-text-muted); display: block; margin-top: 2px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: var(--cds-radius-md); border: none; background: transparent;
    color: var(--cds-text-secondary); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: background-color 150ms var(--cds-ease-out), transform 90ms var(--cds-ease-snap);
  }
  .icon-btn:hover { background: var(--cds-surface-hover); color: var(--cds-text-primary); }
  .icon-btn:active { transform: scale(0.95); }

  .nav-hero-kicker { font-size: 12px; color: var(--cds-text-muted); display: block; }
  .nav-hero-title { font-size: 22px; font-weight: 600; color: var(--cds-text-primary); line-height: 1.25; }
  .nav-back {
    display: inline-flex; align-items: center; gap: 4px; border: none; background: transparent;
    color: var(--cds-text-accent); font-size: 12px; font-weight: 500; padding: 2px 0; margin-bottom: 3px; cursor: pointer;
  }
  .nav-back:hover { opacity: 0.78; }

  /* 7-Stop Non-Linear Scroll Fade Mask */
  .scroll-fade {
    --f-top: 12px; --f-bot: 16px;
    -webkit-mask-image: linear-gradient(to bottom,
      transparent 0%, rgba(0,0,0,0.05) calc(var(--f-top)*0.15), rgba(0,0,0,0.18) calc(var(--f-top)*0.32),
      rgba(0,0,0,0.38) calc(var(--f-top)*0.5), rgba(0,0,0,0.64) calc(var(--f-top)*0.68), rgba(0,0,0,0.88) calc(var(--f-top)*0.85),
      #000 var(--f-top), #000 calc(100% - var(--f-bot)),
      rgba(0,0,0,0.88) calc(100% - var(--f-bot)*0.85), rgba(0,0,0,0.64) calc(100% - var(--f-bot)*0.68),
      rgba(0,0,0,0.38) calc(100% - var(--f-bot)*0.5), rgba(0,0,0,0.18) calc(100% - var(--f-bot)*0.32),
      rgba(0,0,0,0.05) calc(100% - var(--f-bot)*0.15), transparent 100%);
    mask-image: linear-gradient(to bottom,
      transparent 0%, rgba(0,0,0,0.05) calc(var(--f-top)*0.15), rgba(0,0,0,0.18) calc(var(--f-top)*0.32),
      rgba(0,0,0,0.38) calc(var(--f-top)*0.5), rgba(0,0,0,0.64) calc(var(--f-top)*0.68), rgba(0,0,0,0.88) calc(var(--f-top)*0.85),
      #000 var(--f-top), #000 calc(100% - var(--f-bot)),
      rgba(0,0,0,0.88) calc(100% - var(--f-bot)*0.85), rgba(0,0,0,0.64) calc(100% - var(--f-bot)*0.68),
      rgba(0,0,0,0.38) calc(100% - var(--f-bot)*0.5), rgba(0,0,0,0.18) calc(100% - var(--f-bot)*0.32),
      rgba(0,0,0,0.05) calc(100% - var(--f-bot)*0.15), transparent 100%);
  }

  .nav-scroll { flex: 1; overflow-y: auto; padding: 13px 11px 20px; }
  .nav-group { margin-bottom: 16px; }
  .nav-group-title {
    margin: 0 0 5px 0; padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--cds-text-muted);
  }
  .nav-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7.5px 10px; border-radius: var(--cds-radius-md);
    color: var(--cds-text-secondary); font-size: 13.5px; cursor: pointer;
    transition: background-color 150ms var(--cds-ease-out), color 150ms var(--cds-ease-out), transform 90ms var(--cds-ease-snap);
  }
  .nav-row:hover { background: var(--cds-surface-hover); color: var(--cds-text-primary); }
  .nav-row:active { transform: scale(0.99); }
  .nav-row.is-active { background: var(--cds-clay-soft); color: var(--brand); font-weight: 600; }
  .nav-row-sub { padding: 9px 11px; font-size: 14px; }
  .nav-label { display: inline-flex; align-items: center; gap: 5px; }
  .help-dot {
    width: 19px; height: 19px; border-radius: 50%; border: none;
    background: var(--cds-accent-soft); color: var(--cds-text-accent);
    font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; opacity: 0.75;
    transition: all 140ms var(--cds-ease-out);
  }
  .nav-row:hover .help-dot, .nav-row.is-active .help-dot { opacity: 1; }
  .help-dot:hover { background: var(--cds-text-accent); color: #fff; transform: scale(1.07); }

  .sub-callout {
    margin: 16px 6px 0; padding: 11px 13px; border-radius: var(--cds-radius-panel);
    background: var(--cds-surface-2); border: 1px solid var(--cds-border-subtle); font-size: 12px; color: var(--cds-text-secondary);
  }
  .sub-callout strong { display: block; color: var(--cds-text-primary); margin-bottom: 3px; }

  .nav-footer {
    padding: 11px 13px; border-top: 1px solid var(--cds-border-subtle);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .op-meta { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .led { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--cds-success); }
  .led.is-running { background: var(--cds-clay); }
  .op-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op-sub { font-size: 11px; color: var(--cds-text-muted); }

  /* Right Workspace */
  .workspace-col { display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow: hidden; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 10px 20px; border-bottom: 1px solid var(--cds-border-subtle); background: var(--cds-surface-0);
  }
  .segmented {
    display: inline-flex; padding: 2px; border-radius: var(--cds-radius-pill); background: var(--cds-surface-3); gap: 2px;
  }
  .seg-btn {
    border: none; background: transparent; color: var(--cds-text-secondary); font-family: inherit;
    font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: var(--cds-radius-pill); cursor: pointer;
    transition: all 150ms var(--cds-ease-out);
  }
  .seg-btn:hover { color: var(--cds-text-primary); }
  .seg-btn.is-active { background: var(--cds-surface-2); color: var(--cds-text-primary); font-weight: 600; box-shadow: var(--cds-shadow-pill); }

  .telemetry {
    display: inline-flex; align-items: center; gap: 10px; padding: 4px 12px 4px 6px;
    border-radius: var(--cds-radius-pill); background: var(--cds-surface-2); border: 1px solid var(--cds-border-subtle);
    font-size: 12px; cursor: pointer;
  }
  .telemetry:hover { border-color: var(--cds-border-strong); }
  .t-sep { width: 1px; height: 12px; background: var(--cds-border-subtle); }
  .t-lbl { color: var(--cds-text-muted); margin-right: 3px; }
  .t-unit { color: var(--cds-text-muted); font-size: 11px; margin-left: 2px; }

  .ws-scroll { flex: 1; overflow-y: auto; padding: 18px 22px 36px; }
  .ws-inner { max-width: 1080px; margin: 0 auto; }

  /* Cards, Buttons, Tables, Badges */
  .banner {
    background: var(--cds-surface-2); border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-card);
    padding: 16px 20px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; box-shadow: var(--cds-shadow-card);
  }
  .banner h1 { margin: 0; font-family: var(--cds-font-serif); font-size: 19px; font-weight: 600; }
  .banner p { margin: 3px 0 0; font-size: 12.5px; color: var(--cds-text-secondary); }

  .card {
    background: var(--cds-surface-2); border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-card);
    padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--cds-shadow-card);
  }
  .card-title {
    margin: 0 0 13px; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 13px;
    border-radius: var(--cds-radius-md); border: none; background: var(--cds-surface-3); color: var(--cds-text-primary);
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: background-color 150ms var(--cds-ease-out), transform 90ms var(--cds-ease-snap);
  }
  .btn:hover:not(:disabled) { background: var(--cds-surface-active); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
  .btn-danger { background: var(--cds-danger-bg); color: var(--cds-danger); }
  .btn-danger:hover:not(:disabled) { background: var(--cds-danger); color: #fff; }
  .btn-sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: var(--cds-radius-sm); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--cds-radius-pill);
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  .b-ready { background: var(--cds-success-bg); color: var(--cds-success); }
  .b-run { background: var(--cds-clay-soft); color: var(--brand); }
  .b-warn { background: var(--cds-warning-bg); color: var(--cds-warning); }
  .b-muted { background: var(--cds-surface-3); color: var(--cds-text-secondary); }
  .b-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }

  .metric {
    background: var(--cds-surface-2); border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-card);
    padding: 14px 15px; box-shadow: var(--cds-shadow-card);
  }
  .metric-val { font-size: 22px; font-weight: 600; margin: 7px 0 4px; }
  .hint { font-size: 12px; color: var(--cds-text-muted); }

  .guide-card {
    background: var(--cds-surface-1); border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-panel);
    padding: 15px; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    transition: all 150ms var(--cds-ease-out);
  }
  .guide-card:hover { background: var(--cds-surface-2); border-color: var(--cds-border-strong); transform: translateY(-1px); }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .label { font-size: 12.5px; font-weight: 500; }
  .input, .select {
    width: 100%; padding: 8px 11px; font-family: inherit; font-size: 13.5px;
    color: var(--cds-text-primary); background: var(--cds-surface-0);
    border: 1px solid var(--cds-border-strong); border-radius: var(--cds-radius-md); outline: none;
  }
  .input:focus, .select:focus { background: var(--cds-surface-2); border-color: var(--cds-border-accent); box-shadow: var(--cds-focus-shadow); }

  .stepper {
    display: flex; align-items: center; gap: 6px; margin-bottom: 14px; padding: 7px 11px;
    background: var(--cds-surface-1); border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-panel); overflow-x: auto;
  }
  .step-item {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: var(--cds-radius-pill);
    font-size: 12.5px; color: var(--cds-text-muted); cursor: pointer; white-space: nowrap;
  }
  .step-num {
    width: 20px; height: 20px; border-radius: 50%; background: var(--cds-surface-3); color: var(--cds-text-secondary);
    font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
  }
  .step-item.is-active { background: var(--cds-surface-2); color: var(--cds-text-primary); font-weight: 600; box-shadow: var(--cds-shadow-pill); }
  .step-item.is-active .step-num { background: var(--brand); color: #fff; }
  .step-item.is-done { color: var(--cds-success); }
  .step-item.is-done .step-num { background: var(--cds-success); color: #fff; }

  .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-panel); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--cds-surface-1); color: var(--cds-text-secondary); font-size: 12px; font-weight: 600; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--cds-border-subtle); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--cds-border-subtle); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--cds-surface-hover); }
  tbody tr.is-sel { background: var(--cds-clay-soft); }

  .prompt-hero { background: var(--cds-surface-1); border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-panel); padding: 18px 20px; }
  .wiz-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--cds-border-subtle); }

  /* Charts */
  .chart-box { background: var(--cds-surface-1); border: 1px solid var(--cds-border-subtle); border-radius: var(--cds-radius-panel); padding: 11px 13px 7px; }
  .chart-svg { width: 100%; height: auto; display: block; }

  /* Autosampler Tray */
  .vial-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px; }
  .vial {
    aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--cds-border-subtle);
    font-size: 11px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: transform 100ms var(--cds-ease-snap);
  }
  .vial:hover { transform: scale(1.06); }
  .vial.is-sel { box-shadow: 0 0 0 2px var(--cds-surface-2), 0 0 0 4px var(--brand); }
  .v-empty { background: var(--cds-surface-1); color: var(--cds-text-muted); }
  .v-blank { background: var(--cds-surface-3); color: var(--cds-text-primary); }
  .v-std { background: var(--cds-accent-soft); color: var(--cds-text-accent); border-color: var(--cds-border-accent); }

      const ctx = new AC(), osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine';
      const t = ctx.currentTime;
      osc.frequency.setValueAtTime(kind === 'ok' ? 520 : 420, t);
      osc.frequency.exponentialRampToValueAtTime(kind === 'ok' ? 760 : 340, t + 0.09);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.15);
      setTimeout(() => ctx.close().catch(() => {}), 220);
    } catch {}

  // =====================================================================
  // Scientific SVG Builders (Chromatogram + Gradient Curve)
  // =====================================================================
  function svgChromatogram(proj, progressT, showPress, showInteg, selPeak) {
    const W = 720, H = 240, P = { t: 24, r: 36, b: 32, l: 48 };
    const pw = W - P.l - P.r, ph = H - P.t - P.b;
    const total = proj.runTime || 8.0;
    const maxT = Math.min(total, Math.max(0.05, progressT));
    const sx = t => P.l + (t / total) * pw;
    const sy = y => P.t + ph - ((Math.max(-2, Math.min(110, y)) + 2) / 112) * ph;
    const evalY = t => {
      let y = 1.6 + 0.45 * Math.sin(t * 0.9) + (t / total) * 1.8 + 11 * Math.exp(-Math.pow((t - 0.68) / 0.08, 2));
      for (const pk of proj.peaks) y += pk.h * Math.exp(-Math.pow((t - pk.rt) / (pk.w || 0.14), 2));
      return y;
    };
    let sigD = '';
    for (let i = 0; i <= 240; i++) {
      const t = (i / 240) * maxT;
      sigD += (i === 0 ? 'M' : 'L') + sx(t).toFixed(1) + ',' + sy(evalY(t)).toFixed(1);
    }
    let pressD = '';
    if (showPress) {
      for (let i = 0; i <= 90; i++) {
        const t = (i / 90) * maxT;
        const pY = 58 + 20 * Math.sin((t / total) * Math.PI) + 1.4 * Math.cos(t * 3);
        pressD += (i === 0 ? 'M' : 'L') + sx(t).toFixed(1) + ',' + sy(pY).toFixed(1);
      }
    }
    let areas = '';
    if (showInteg) {
      for (const pk of proj.peaks) {
        if (pk.rt > maxT) continue;
        const t0 = Math.max(0, pk.rt - pk.w * 2.5), t1 = Math.min(total, pk.rt + pk.w * 2.5);
        let d = `M${sx(t0).toFixed(1)},${sy(evalY(t0)).toFixed(1)}`;
        for (let i = 0; i <= 28; i++) {
          const t = t0 + (i / 28) * (t1 - t0);
          d += `L${sx(t).toFixed(1)},${sy(evalY(t)).toFixed(1)}`;
        }
        d += `L${sx(t1).toFixed(1)},${sy(evalY(t1)).toFixed(1)} Z`;
        const fill = pk.name === selPeak ? 'rgba(217,119,87,0.3)' : 'rgba(217,119,87,0.13)';
        areas += `<path d="${d}" fill="${fill}" style="cursor:pointer" data-sel-peak="${esc(pk.name)}"/>`;
      }
    }
    let labels = '';
    for (const pk of proj.peaks) {
      if (pk.rt > maxT + 0.04) continue;
      const cx = sx(pk.rt), cy = sy(evalY(pk.rt));
      const isS = pk.name === selPeak;
      labels += `<g style="cursor:pointer" data-sel-peak="${esc(pk.name)}">
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${isS ? 4.2 : 3.2}" fill="${isS ? 'var(--brand)' : 'var(--cds-surface-2)'}" stroke="var(--brand)" stroke-width="1.8"/>
        <text x="${cx.toFixed(1)}" y="${Math.max(14, cy - 11).toFixed(1)}" text-anchor="middle" fill="var(--cds-text-primary)" font-size="10.5" font-weight="600">${esc(pk.name)}</text>

  function svgGradient(steps) {
    const W = 500, H = 172, P = { t: 16, r: 18, b: 28, l: 40 };
    const pw = W - P.l - P.r, ph = H - P.t - P.b;
    const sorted = [...steps].map(s => ({ t: Number(s.t)||0, b: Math.max(0, Math.min(100, Number(s.b)||0)) })).sort((a,b)=>a.t-b.t);
    const maxT = Math.max(1, sorted[sorted.length - 1]?.t || 8);
    const sx = t => P.l + (t / maxT) * pw;
    const sy = b => P.t + ph - (b / 100) * ph;
    const line = sorted.map((s,i) => `${i===0?'M':'L'}${sx(s.t).toFixed(1)},${sy(s.b).toFixed(1)}`).join(' ');
    const area = sorted.length ? `${line} L${sx(sorted[sorted.length-1].t).toFixed(1)},${sy(0).toFixed(1)} L${sx(sorted[0].t).toFixed(1)},${sy(0).toFixed(1)} Z` : '';
    const dots = sorted.map(s => `<circle cx="${sx(s.t).toFixed(1)}" cy="${sy(s.b).toFixed(1)}" r="3.4" fill="var(--cds-surface-2)" stroke="var(--cds-text-accent)" stroke-width="2"/>`).join('');
    return `<div class="chart-box">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
        <span style="font-weight:600;color:var(--cds-text-secondary)">流动相梯度曲线 (%B 有机相比例)</span>
        <span class="mono hint">总时长 ${maxT.toFixed(1)} min</span>
      </div>
      <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
        ${[0,50,100].map(p=>`<line x1="${P.l}" x2="${W-P.r}" y1="${sy(p)}" y2="${sy(p)}" stroke="var(--cds-border-subtle)" stroke-dasharray="2 3"/>
        <text x="${P.l-6}" y="${sy(p)+3.5}" text-anchor="end" fill="var(--cds-text-muted)" font-size="10" class="mono">${p}%</text>`).join('')}
        <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}" stroke="var(--cds-border-strong)"/>
        <line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" stroke="var(--cds-border-strong)"/>
        <text x="${P.l}" y="${H-7}" fill="var(--cds-text-muted)" font-size="10" class="mono">0.0 min</text>
        <text x="${P.l+pw/2}" y="${H-7}" text-anchor="middle" fill="var(--cds-text-muted)" font-size="10" class="mono">${(maxT/2).toFixed(1)} min</text>
        <text x="${W-P.r}" y="${H-7}" text-anchor="end" fill="var(--cds-text-muted)" font-size="10" class="mono">${maxT.toFixed(1)} min</text>
        <path d="${area}" fill="var(--cds-accent-soft)"/>
        <path d="${line}" fill="none" stroke="var(--cds-text-accent)" stroke-width="2"/>
        ${dots}
      </svg>
    </div>`;
  }

          </div>

            <div style="background:var(--cds-surface-1);padding:15px;border-radius:10px;border:1px solid var(--cds-border-subtle);display:flex;flex-direction:column;gap:8px">
              <div class="hint" style="border-bottom:1px solid var(--cds-border-subtle);padding-bottom:6px">${esc(state.report.lab)}</div>
              <div class="editorial" style="font-size:16px;font-weight:600">高效液相色谱定量分析报告 (COA)</div>
              <div class="hint mono">项目：pesticides_test · 波长：254 nm · 导出：${esc(state.report.fmt)}</div>
              <div style="background:var(--cds-surface-2);border:1px dashed var(--cds-border-strong);border-radius:6px;padding:8px 10px;font-size:12px">定量表：多菌灵 12.45 · 吡虫啉 24.80 · 啶虫脒 9.86 μg/mL</div>
              ${state.report.chrom ? '<div style="background:var(--cds-surface-2);border:1px dashed var(--cds-border-strong);border-radius:6px;padding:8px 10px;font-size:12px">[ 嵌入式 UV 254 nm 积分色谱图区域 ]</div>' : ''}
              ${state.report.cal ? '<div style="background:var(--cds-surface-2);border:1px dashed var(--cds-border-strong);border-radius:6px;padding:8px 10px;font-size:12px">[ 校准曲线图 · R² = 0.9998 ]</div>' : ''}
              ${state.report.sst ? '<div style="background:var(--cds-surface-2);border:1px dashed var(--cds-border-strong);border-radius:6px;padding:8px 10px;font-size:12px">[ SST 校验：N=11,240 · T=1.04 · RSD=0.28% · 合格 ]</div>' : ''}
            </div>
          </div>
        </div>`;
    }

    // Remaining setup/manage views: user-profile, processing-params, sharing, archive, features
    const cfgTitles = {
      'user-profile': ['用户简介', '操作员身份、锁屏超时与电子签名策略。'],
      'processing-params': ['处理参数', '默认积分阈值、保留时间识别窗口与校准加权方式。'],
      'sharing': ['共享与实验室同步', '导出加密检测项目包 (.lcpkg) 或与 LIMS 双向同步。'],
      'archive': ['归档存档', '检索历史只读色谱归档包与 SHA-256 完整性指纹。'],
      'features': ['功能与硬件模块', '查看已连接的液相色谱硬件固件与软件授权。']
    };
    const [t, desc] = cfgTitles[state.view] || ['系统配置', '液相色谱工作站参数管理。'];
    return `<div class="banner"><div><h1>${t}</h1><p>${desc}</p></div><button class="btn btn-primary" data-toast="已保存「${t}」设置">保存配置</button></div>
      <div class="card">
        ${state.view === 'user-profile' ? `<div class="grid-2">
          <div class="field"><label class="label">操作员姓名</label><input class="input" value="${esc(state.operator.name)}"/></div>
          <div class="field"><label class="label">账号 ID</label><input class="input mono" value="${esc(state.operator.id)}"/></div>
          <div class="field"><label class="label">角色权限</label><select class="select"><option>方法管理员 / QC</option><option>例行分析操作员</option></select></div>
          <div class="field"><label class="label">自动锁屏 (分钟)</label><input type="number" class="input mono" value="${state.operator.autoLock}"/></div>
        </div>` : state.view === 'processing-params' ? `<div class="grid-2">
          <div class="field"><label class="label">最小峰面积 (mAU·s)</label><input type="number" class="input mono" value="${state.procParams.minArea}"/></div>
          <div class="field"><label class="label">最小峰高 (mAU)</label><input type="number" step="0.1" class="input mono" value="${state.procParams.minHeight}"/></div>
          <div class="field"><label class="label">保留时间窗口 (± min)</label><input type="number" step="0.01" class="input mono" value="${state.procParams.rtWin}"/></div>
          <div class="field"><label class="label">校准加权</label><select class="select"><option>1/x 加权线性回归</option><option>1/x² 加权线性回归</option></select></div>
        </div>` : state.view === 'archive' ? `<div class="table-wrap"><table>
          <thead><tr><th>归档编号</th><th>关联项目</th><th>批次数</th><th>大小</th><th>SHA-256 指纹</th></tr></thead>
          <tbody>
            <tr><td class="mono"><b>ARC-20261119-A</b></td><td class="mono">pesticides_test</td><td class="mono">12 批</td><td class="mono">48.2 MB</td><td class="mono hint">sha256:8f91…c32d</td></tr>
            <tr><td class="mono"><b>ARC-20261116-B</b></td><td class="mono">analgesic_assay</td><td class="mono">9 批</td><td class="mono">31.7 MB</td><td class="mono hint">sha256:4a12…9e07</td></tr>
          </tbody>
        </table></div>` : `<div class="table-wrap"><table>
          <thead><tr><th>模块 / 服务</th><th>版本 / 地址</th><th>状态</th></tr></thead>
          <tbody>
            <tr><td><b>四元高压梯度泵 (Q-Pump 3000)</b></td><td class="mono">v4.12.0</td><td><span class="badge b-ready">在线 · 就绪</span></td></tr>
            <tr><td><b>自动进样器 (48/96 位控温)</b></td><td class="mono">v3.8.5</td><td><span class="badge b-ready">15.0 °C 稳定</span></td></tr>
            <tr><td><b>UV / DAD 二极管阵列检测器</b></td><td class="mono">v5.0.3</td><td><span class="badge b-ready">氘灯已点亮</span></td></tr>
            <tr><td><b>LIMS 实验室双向同步服务</b></td><td class="mono">lims.lab.internal</td><td><span class="badge b-ready">已连接</span></td></tr>
          </tbody>
        </table></div>`}
      </div>`;
  }

  function renderModals() {
    let html = '';
    if (state.help) {
      html += `<div class="overlay" data-close-help>
        <div class="dialog" onclick="event.stopPropagation()">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:9px"><span class="help-dot" style="opacity:1;width:23px;height:23px">?</span><b>${esc(state.help.title)}</b></div>
            <button class="btn btn-sm" data-close-help>关闭</button>
          </div>
          <p style="margin:0 0 16px;font-size:13.5px;color:var(--cds-text-secondary);line-height:1.65">${esc(state.help.body)}</p>
          <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" data-close-help>知道了</button></div>
        </div>
      </div>`;
    }
    if (state.locked) {
      html += `<div class="overlay">
        <div class="dialog" style="max-width:370px;text-align:center">
          <div class="brand-mark" style="width:44px;height:44px;border-radius:12px;margin:0 auto 12px">🔒</div>
          <h2 class="editorial" style="margin:0 0 6px;font-size:20px">工作站已锁定</h2>
          <p class="hint" style="margin:0 0 14px">当前液相色谱流路保持安全运行（${state.inst.pressure.toFixed(1)} bar），请输入操作员 PIN 解锁。</p>
          <div class="field" style="text-align:left"><label class="label">操作员 PIN（演示可直接点击解锁）</label><input id="pin-in" type="password" class="input mono" placeholder="••••"/></div>
          <button class="btn btn-primary" style="width:100%;height:35px" data-unlock>解锁工作站</button>
        </div>
      </div>`;
    }
    if (state.toast) {
      const color = state.toast.type === 'warn' ? 'var(--cds-warning)' : 'var(--cds-success)';
      html += `<div class="toast"><span class="b-dot" style="background:${color}"></span><span>${esc(state.toast.msg)}</span></div>`;
    }
    return html;
  }

  function render() {
    document.documentElement.classList.toggle('dark', state.dark);
    document.getElementById('root').innerHTML = `
      <div class="shell">
        ${renderLeftNav()}
        <div class="workspace-col">
          ${renderTopBar()}
          <main class="ws-scroll scroll-fade"><div class="ws-inner">${renderMainView()}</div></main>
        </div>
      </div>
      ${renderModals()}`;
  }

  // =====================================================================
  // Simulation Helpers
  // =====================================================================
  function startRun() {
    if (state.running) return;
    const p = curProj();
    state.runStep = 3;
    state.running = true;
    if (state.runProgress >= p.runTime) state.runProgress = 0;
    const idx = state.sequence.findIndex(s => s.status === 'ready' || s.status === 'queued');
    const activeIdx = idx >= 0 ? idx : 2;
    state.sequence[activeIdx].status = 'running';
    state.inst.status = 'running';
    state.inst.statusText = '正在采集';
    state.inst.wl = p.wl;
    state.inst.flow = p.flow;
    state.inst.colTemp = p.colTemp;
    state.inst.activeVial = state.sequence[activeIdx].vial;
    playChime('ok');
    toast(`已启动采集：${p.displayName}`);
    runTimer = setInterval(() => {
      state.runProgress = +(state.runProgress + 0.14).toFixed(2);
      const r = state.runProgress / p.runTime;
      state.inst.pressure = +(178 + 26 * Math.sin(r * Math.PI) + (Math.random() - 0.5) * 1.1).toFixed(1);
      if (state.runProgress >= p.runTime) {
        state.runProgress = p.runTime;
        stopRun(true, activeIdx);
      } else {
        render();
      }
    }, 150);
  }

  function stopRun(done, idx) {
    clearInterval(runTimer);
    state.running = false;
    state.inst.status = 'ready';
    state.inst.statusText = '仪器就绪';
    state.inst.pressure = 182.4;
    if (done && state.sequence[idx]) {
      state.sequence[idx].status = 'done';
      if (state.sequence[idx + 1]?.status === 'queued') state.sequence[idx + 1].status = 'ready';
      playChime('ok');
      toast(`瓶位 ${state.sequence[idx].vial} 采集完成，谱图已自动保存`);
    } else {
      state.runProgress = 0;
      toast('已中止采集并恢复初始梯度', 'warn');
    }
  }

  // =====================================================================
  // Event Delegation (Click + Input + CJK IME Guard)
  // =====================================================================
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-help-title],[data-nav],[data-sub],[data-action],[data-top],[data-jump],[data-run],[data-run-step],[data-pick-proj],[data-cstep],[data-grad],[data-grad-del],[data-save-proj],[data-move],[data-toggle-proj],[data-del-ask],[data-del-confirm],[data-del-cancel],[data-sel-peak],[data-approve],[data-sst-run],[data-purge-start],[data-lamp-check],[data-needle-wash],[data-vial],[data-clone-proj],[data-toast],[data-close-help],[data-unlock]');
    if (!t) return;

    if (t.dataset.helpTitle) {
      e.stopPropagation();
      state.help = { title: t.dataset.helpTitle, body: t.dataset.helpBody };
      return render();
    }
    if (t.dataset.closeHelp !== undefined) { state.help = null; return render(); }
    if (t.dataset.unlock !== undefined) { state.locked = false; playChime('ok'); return toast('欢迎回来，' + state.operator.name); }
    if (t.dataset.action === 'home') { state.drill = null; state.view = 'home'; state.mobileOpen = false; return render(); }
    if (t.dataset.action === 'lock') { state.locked = true; playChime('lock'); return render(); }
    if (t.dataset.action === 'theme') { state.dark = !state.dark; return render(); }
    if (t.dataset.action === 'mobile-menu') { state.mobileOpen = !state.mobileOpen; return render(); }

    if (t.dataset.nav) {
      const item = ROOT_GROUPS.flatMap(g => g.items).find(i => i.id === t.dataset.nav);
      if (item) {
        state.drill = item.drill || null;
        if (item.sub) state.sub = item.sub;
        state.view = item.view;
        state.mobileOpen = false;
        render();
      }
      return;
    }
    if (t.dataset.sub) { state.sub = t.dataset.sub; state.view = 'test-projects'; state.mobileOpen = false; return render(); }
    if (t.dataset.top) {
      const id = t.dataset.top;
      if (id === 'home') { state.drill = null; state.view = 'home'; }
      else if (id === 'help') { state.help = { title: 'LC-Guide® 操作说明', body: '左侧采用 AB SCIEX Cliquid 风格双层任务导航：点击「检测项目」左侧自动切换为子操作菜单；每个菜单右侧「?」均可查看 SOP 提示；左下角支持浅色温润纸感与暗调护眼模式一键切换。' }; }
      else if (id === 'lock') { state.locked = true; playChime('lock'); }
      else { state.drill = null; state.view = id; }
      return render();
    }
    if (t.dataset.jump) {
      const j = t.dataset.jump;
      if (j === 'create-project') { state.drill = 'test-projects'; state.sub = 'create-project'; state.view = 'test-projects'; }
      else { state.drill = null; state.view = j; }
      return render();
    }
    if (t.dataset.run === 'start') return startRun();
    if (t.dataset.run === 'pause') { clearInterval(runTimer); state.running = false; state.inst.status = 'ready'; state.inst.statusText = '已暂停'; return toast('采集已暂停', 'warn'); }
    if (t.dataset.run === 'stop') return stopRun(false);
    if (t.dataset.runStep) { state.runStep = Number(t.dataset.runStep); return render(); }
    if (t.dataset.pickProj) { state.selProjId = t.dataset.pickProj; return render(); }
    if (t.dataset.cstep) {
      const n = Number(t.dataset.cstep);
      if (n > 1 && !state.draft.name.trim()) return toast('请先为新检测项目提供一个名称', 'warn');
      state.createStep = n; return render();
    }
    if (t.dataset.grad === 'add') {
      const g = state.draft.gradient;
      const last = g[g.length - 1] || { t: 0, b: 20 };
      g.push({ t: +(Number(last.t) + 1).toFixed(1), b: last.b });
      return render();
    }
    if (t.dataset.gradDel !== undefined) {
      if (state.draft.gradient.length <= 2) return toast('至少保留 2 个梯度节点', 'warn');
      state.draft.gradient.splice(Number(t.dataset.gradDel), 1);
      return render();
    }
    if (t.dataset.saveProj !== undefined) {
      const d = state.draft;
      const maxT = Math.max(...d.gradient.map(g => Number(g.t)||0), 5);
      const np = {
        id: 'p' + Date.now(), name: d.name.trim(), displayName: d.displayName.trim() || d.name.trim(),
        code: d.code, matrix: d.matrix, enabled: true, column: d.col, phaseA: d.phaseA, phaseB: d.phaseB,
        flow: Number(d.flow)||1, colTemp: Number(d.colTemp)||35, injVol: Number(d.injVol)||10, wl: Number(d.wl)||254,
        runTime: maxT, updatedAt: '刚刚创建', gradient: d.gradient.map(x=>({...x})),
        peaks: [
          { name: '目标峰 A', rt: +(maxT*0.3).toFixed(2), h: 74, w: 0.14, area: 448200, plates: 9820, tail: 1.05, rs: 0, conc: '16.50 μg/mL' },
          { name: '目标峰 B', rt: +(maxT*0.58).toFixed(2), h: 86, w: 0.15, area: 591300, plates: 12450, tail: 1.04, rs: 6.72, conc: '28.40 μg/mL' }
        ]
      };
      state.projects.unshift(np);
      state.selProjId = np.id;
      state.createStep = 1;
      playChime('ok');
      return toast(`已成功创建并启用项目「${np.name}」`);
    }
    if (t.dataset.move) {
      const [i, d] = t.dataset.move.split(':').map(Number);
      const [item] = state.projects.splice(i, 1);
      state.projects.splice(i + d, 0, item);
      return toast(`已调整「${item.displayName}」排序`);
    }
    if (t.dataset.toggleProj) {
      const p = state.projects.find(x => x.id === t.dataset.toggleProj);
      if (p) { p.enabled = !p.enabled; playChime('ok'); toast(p.enabled ? `已启用「${p.displayName}」` : `已撤销「${p.displayName}」`, p.enabled ? 'ok' : 'warn'); }
      return;
    }
    if (t.dataset.delAsk) { state.pendingDelId = t.dataset.delAsk; return render(); }
    if (t.dataset.delCancel !== undefined) { state.pendingDelId = null; return render(); }
    if (t.dataset.delConfirm) {
      if (state.projects.length <= 1) return toast('至少保留 1 个检测项目', 'warn');
      state.projects = state.projects.filter(x => x.id !== t.dataset.delConfirm);
      state.pendingDelId = null;
      return toast('已删除选定检测项目', 'warn');
    }
    if (t.dataset.selPeak) { state.selPeakName = t.dataset.selPeak; return render(); }
    if (t.dataset.approve !== undefined) { state.batchApproved = true; playChime('ok'); return toast('已完成批次定量审核并电子签批'); }
    if (t.dataset.sstRun !== undefined) {
      state.sstMetrics[0].val = (10800 + Math.floor(Math.random()*900)).toLocaleString();
      state.sstMetrics[1].val = (1.02 + Math.random()*0.05).toFixed(2);
      state.sstMetrics[3].val = (0.21 + Math.random()*0.14).toFixed(2) + '%';
      state.sstLast = '刚刚验证通过 (6 针对照品)';
      playChime('ok');
      return toast('系统适配性测试 (SST) 全部指标合格');
    }
    if (t.dataset.purgeStart !== undefined) {
      if (state.purging) return;
      state.purging = true; state.purgePct = 10; state.inst.status = 'running'; state.inst.statusText = '流动相排气泡中';
      render();
      purgeTimer = setInterval(() => {
        state.purgePct += 15;
        if (state.purgePct >= 100) {
          clearInterval(purgeTimer); state.purgePct = 100; state.purging = false;
          state.inst.status = 'ready'; state.inst.statusText = '仪器就绪';
          playChime('ok'); toast('流动相灌注排气泡完成，压力脉动 < 0.3 bar');
        } else render();
      }, 220);
      return;
    }
    if (t.dataset.lampCheck !== undefined) { state.lampDiag = '通过 · 波长准确度 +0.1 nm，氘灯能量 94.6%，基线噪声 0.012 mAU'; playChime('ok'); return toast('UV/DAD 光学自检通过'); }
    if (t.dataset.needleWash !== undefined) { state.needleDiag = '刚刚完成深度清洗 · 残留验证 < 0.005%'; playChime('ok'); return toast('进样针 3 次循环清洗完成'); }
    if (t.dataset.vial) { state.selVialPos = t.dataset.vial; return render(); }
    if (t.dataset.cloneProj) {
      const p = state.projects.find(x => x.id === t.dataset.cloneProj);
      if (p) { state.projects.unshift({ ...p, id: 'p'+Date.now(), name: p.name+'_copy', displayName: p.displayName+' (副本)', enabled: true, updatedAt: '刚刚克隆' }); playChime('ok'); toast('已从方法库克隆新项目'); }
      return;
    }
    if (t.dataset.toast) { playChime('ok'); return toast(t.dataset.toast); }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.draft) state.draft[el.dataset.draft] = el.value;
    if (el.dataset.gt !== undefined) { state.draft.gradient[el.dataset.gt].t = Number(el.value); render(); }
    if (el.dataset.gb !== undefined) { state.draft.gradient[el.dataset.gb].b = Number(el.value); render(); }
    if (el.dataset.ep) {
      const ep = state.projects.find(p => p.id === state.editId);
      if (ep) ep[el.dataset.ep] = Number(el.value);
    }
    if (el.dataset.vialName !== undefined) {
      const sv = state.vials.find(v => v.pos === state.selVialPos);
      if (sv) sv.name = el.value;
    }
    if (el.dataset.vialVol !== undefined) {
      const sv = state.vials.find(v => v.pos === state.selVialPos);
      if (sv) sv.vol = Number(el.value);
    }
    if (el.dataset.rep) { state.report[el.dataset.rep] = el.value; render(); }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.togglePress !== undefined) { state.showPressure = el.checked; render(); }
    if (el.dataset.editPick !== undefined) { state.editId = el.value; render(); }
    if (el.dataset.procProj !== undefined) { state.selProjId = el.value; render(); }
    if (el.dataset.purgeCh) { state.purgeCh[el.dataset.purgeCh] = el.checked; render(); }
    if (el.dataset.vialType !== undefined) {
      const sv = state.vials.find(v => v.pos === state.selVialPos);
      if (sv) { sv.type = el.value; render(); }
    }
    if (el.dataset.repChk) { state.report[el.dataset.repChk] = el.checked; render(); }
  });

  document.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape' && state.help) { state.help = null; render(); }
    if (e.key === 'Enter' && e.target.id === 'd-name') { e.preventDefault(); state.createStep = 2; render(); }
    if (e.key === 'Enter' && e.target.id === 'pin-in') { e.preventDefault(); state.locked = false; playChime('ok'); toast('工作站已解锁'); }
  });

  render();
})();
</script>
</body>
</html>
